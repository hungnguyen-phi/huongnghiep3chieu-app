services:
  app:
    build: .
    container_name: huongnghiep3chieu
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      # Bỏ dòng dưới để dùng SQLite mặc định (data/data.db).
      # Đổi sang Postgres bằng cách bỏ comment và sửa thông tin kết nối:
      # DATABASE_URL: postgresql+psycopg2://user:pass@db:5432/huongnghiep3chieu
      OUTPUT_DIR: /app/output

  # Bỏ comment khối dưới nếu muốn chạy kèm Postgres thay vì SQLite.
