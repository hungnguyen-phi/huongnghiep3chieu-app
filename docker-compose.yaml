services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      # Bỏ dòng dưới để dùng SQLite mặc định (data/data.db).
      # Đổi sang Postgres bằng cách bỏ comment và sửa thông tin kết nối:
      # DATABASE_URL: postgresql+psycopg2://user:pass@db:5432/huongnghiep3chieu
      OUTPUT_DIR: /app/output
      # Tùy chọn: làm giàu lời văn PDF bằng LLM qua OpenRouter (giữ nguyên
      # điểm/tổ hợp/mã Holland do luật tính, chỉ viết lại nhận xét chi tiết
      # hơn). Bỏ trống hoặc xóa dòng OPENROUTER_API_KEY để tắt, app tự dùng
      # lại câu mẫu rule-based, không lỗi.
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: "deepseek/deepseek-v4.1-flash"

  # Bỏ comment khối dưới nếu muốn chạy kèm Postgres thay vì SQLite.
